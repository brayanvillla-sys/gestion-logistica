<div class="caja">
  <h1>Iniciar sesión</h1>
  <p class="sub">Ingresa con tu cuenta institucional</p>

  @if (error()) {
    <div class="alerta">{{ error() }}</div>
  }

  <label>
    Correo
    <input type="email" [(ngModel)]="email" name="email" placeholder="nombre@risaralda.gov.co" (keyup.enter)="ingresar()" />
  </label>

  <label>
    Contraseña
    <input type="password" [(ngModel)]="password" name="password" placeholder="••••••" (keyup.enter)="ingresar()" />
  </label>

  <button (click)="ingresar()" [disabled]="cargando()">
    {{ cargando() ? 'Ingresando...' : 'Ingresar' }}
  </button>

  <p class="pie">¿No tienes cuenta? <a routerLink="/registro">Regístrate</a></p>
</div>
